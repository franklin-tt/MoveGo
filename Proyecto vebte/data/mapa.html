<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapa MoveGo Delivery</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([10.0488, -66.8282], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Marcador Origen (Conductor / Salida)
        L.marker([10.0488, -66.8282]).addTo(map)
            .bindPopup('Punto de Origen / Repartidor')
            .openPopup();

        // Marcador Destino (Entrega)
        L.marker([10.0588, -66.8182]).addTo(map)
            .bindPopup('Punto de Destino / Cliente');

        // Línea de ruta entre ambos puntos
        var latlngs = [
            [10.0488, -66.8282],
            [10.0588, -66.8182]
        ];
        var polyline = L.polyline(latlngs, {color: 'blue', weight: 4, opacity: 0.7}).addTo(map);
        map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
    </script>
</body>
</html>
